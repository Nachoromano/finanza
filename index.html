<style>
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --accent:#ff4d1a;--accent2:#ff7a3d;--accent-dim:rgba(255,77,26,.12);
  --text:#f0ece6;--text2:#888880;--text3:#555550;
  --border:rgba(255,255,255,.07);--border-a:rgba(255,77,26,.35);
  --green:#2ecc71;--green-dim:rgba(46,204,113,.12);
  --amber:#f39c12;--red:#e74c3c;--sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

.app-shell{display:flex;min-height:100vh;}
.mob-header{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:99;align-items:center;padding:0 15px;gap:10px;}
.mob-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;}
.mob-logo span{color:var(--accent);}
.mob-menu-btn{margin-left:auto;background:none;border:none;color:var(--text);cursor:pointer;font-size:18px;padding:4px 8px;line-height:1;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:98;}
.overlay.show{display:block;}

.sidebar{width:var(--sidebar);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .25s ease;}
.logo{padding:22px 20px 16px;border-bottom:1px solid var(--border);}
.logo-word{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.05em;line-height:1;}
.logo-word span{color:var(--accent);}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-top:3px;font-family:'DM Mono',monospace;}
.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;border:1px solid transparent;user-select:none;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:var(--accent2);border-color:var(--border-a);}
.nav-icon{width:16px;text-align:center;font-size:13px;}
.sidebar-footer{padding:12px 12px 20px;border-top:1px solid var(--border);}
.month-badge{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;}
.close-month-btn{width:100%;padding:9px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s;}
.close-month-btn:hover{background:var(--accent2);}

.main{margin-left:var(--sidebar);flex:1;padding:26px 26px 80px;max-width:860px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:nowrap;gap:12px;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.04em;line-height:1;white-space:nowrap;}
.page-title span{color:var(--accent);}
.salary-block{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.salary-label{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;}
.salary-input-wrap{position:relative;}
.salary-prefix{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:13px;font-family:'DM Mono',monospace;}
.salary-input{background:var(--bg3);border:1px solid var(--border-a);border-radius:8px;color:var(--text);font-size:13px;font-weight:500;font-family:'DM Mono',monospace;padding:8px 9px 8px 23px;width:145px;outline:none;transition:border-color .15s;}
.salary-input:focus{border-color:var(--accent);}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:15px 17px;position:relative;overflow:hidden;transition:border-color .2s;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:0;transition:opacity .2s;}
.kpi:hover::before{opacity:1;}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.15em;font-family:'DM Mono',monospace;margin-bottom:7px;}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:.03em;line-height:1;}
.kpi-val.ok{color:var(--green);}
.kpi-val.warn{color:var(--amber);}
.kpi-val.bad{color:var(--red);}
.kpi-val.accent{color:var(--accent);}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:4px;font-family:'DM Mono',monospace;}

.panel{display:none;}
.panel.active{display:block;}
.section-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.15em;font-family:'DM Mono',monospace;}

.dash-top{display:grid;grid-template-columns:1fr 192px;gap:14px;margin-bottom:18px;align-items:start;}
.dash-kpis-extra{display:flex;flex-direction:column;gap:6px;}
.kpi-sm{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;}
.kpi-sm-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;font-family:'DM Mono',monospace;margin-bottom:4px;}
.kpi-sm-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1;}
.kpi-sm-sub{font-size:10px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace;}

.donut-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:15px;display:flex;flex-direction:column;align-items:center;}
.donut-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;font-family:'DM Mono',monospace;margin-bottom:11px;align-self:flex-start;}
.donut-svg-wrap{position:relative;width:144px;height:144px;}
.donut-svg-wrap svg{width:100%;height:100%;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-center-pct{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em;line-height:1;transition:color .2s;}
.donut-center-lbl{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
.donut-legend{display:flex;flex-direction:column;gap:6px;margin-top:11px;width:100%;}
.donut-leg-item{display:flex;align-items:center;gap:6px;font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);}
.donut-leg-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0;}
.donut-leg-val{margin-left:auto;color:var(--text);}
.donut-tooltip{position:absolute;pointer-events:none;background:var(--bg3);border:1px solid var(--border-a);border-radius:8px;padding:8px 11px;font-size:11px;font-family:'DM Mono',monospace;color:var(--text);white-space:nowrap;opacity:0;transition:opacity .15s;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;min-width:110px;}
.donut-tooltip.visible{opacity:1;}
.tt-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.tt-val{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.03em;}
.tt-pct{font-size:9px;color:var(--text3);margin-top:2px;}

.wallet-card{background:var(--bg2);border:1px solid var(--border-a);border-radius:12px;padding:16px 19px;margin-bottom:18px;position:relative;overflow:hidden;}
.wallet-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--amber));}
.wallet-header{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.wallet-icon{font-size:15px;}
.wallet-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.05em;}
.wallet-title span{color:var(--accent);}
.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.wallet-item-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono',monospace;margin-bottom:4px;}
.wallet-ars{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;color:var(--green);line-height:1;}
.wallet-usd{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;color:var(--amber);line-height:1;}
.wallet-usd-sub{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
.usd-rate-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:'DM Mono',monospace;background:rgba(243,156,18,.1);color:var(--amber);border:1px solid rgba(243,156,18,.25);border-radius:4px;padding:2px 7px;margin-top:7px;}
.usd-live-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.cost-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 15px;margin-bottom:7px;transition:border-color .15s;}
.cost-top{display:flex;align-items:center;gap:8px;}
.cost-name{font-size:13px;font-weight:500;flex:1;}
.cost-tag{font-size:9px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.07em;}
.tag-fixed{background:rgba(255,77,26,.15);color:var(--accent2);}
.tag-var{background:rgba(46,204,113,.12);color:var(--green);}
.cost-amount{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;}
.cost-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:1px 5px;border-radius:4px;transition:color .15s;line-height:1;}
.cost-del:hover{color:var(--red);}
.progress-wrap{margin-top:8px;}
.progress-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:4px;}
.progress-track{height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.progress-bar{height:100%;border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.bonus-badge{font-size:9px;font-family:'DM Mono',monospace;color:var(--green);background:var(--green-dim);padding:2px 5px;border-radius:4px;margin-left:5px;}
.var-card-clickable{cursor:pointer;}
.var-card-clickable:hover{border-color:var(--border-a) !important;}
.var-card-hint{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:7px;}

.add-form{background:var(--bg2);border:1px dashed var(--border);border-radius:10px;padding:12px 15px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.add-form input,.add-form select{background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:8px 9px;outline:none;font-family:'DM Sans',sans-serif;}
.add-form input:focus,.add-form select:focus{border-color:var(--accent);}
.add-form input[type=text]{flex:1;min-width:110px;}
.add-form input[type=number]{width:115px;font-family:'DM Mono',monospace;}
.add-form select{flex:1;min-width:130px;}
.add-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s;}
.add-btn:hover{background:var(--accent2);}

.reg-expense-list{display:flex;flex-direction:column;gap:6px;margin-top:13px;max-height:280px;overflow-y:auto;}
.reg-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
.ri-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.ri-cat{font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;width:76px;flex-shrink:0;}
.ri-desc{font-size:12px;color:var(--text);flex:1;}
.ri-date{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;}
.ri-amt{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--accent2);letter-spacing:.03em;}

.hist-month-group{margin-bottom:14px;}
.hist-month-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.05em;color:var(--text2);margin-bottom:7px;}
.hist-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}

/* DRAWER */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100vw;background:var(--bg2);border-left:1px solid var(--border);z-index:301;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.drawer.open{transform:translateX(0);}
.drawer-header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border);}
.drawer-back{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px;}
.drawer-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.05em;flex:1;}
.drawer-title span{color:var(--accent);}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px;}
.drawer-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.drawer-stat{background:var(--bg3);border-radius:8px;padding:10px 13px;}
.drawer-stat-label{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:3px;}
.drawer-stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1;}
.drawer-expense-list{display:flex;flex-direction:column;gap:6px;}
.drawer-exp-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.dei-desc{font-size:12px;color:var(--text);flex:1;}
.dei-amt{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent2);letter-spacing:.03em;}
.dei-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:1px 4px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--bg3);border:1px solid var(--border-a);border-radius:10px;padding:10px 17px;font-size:13px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.6);opacity:0;transition:all .3s;z-index:400;max-width:330px;text-align:center;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CLOUD STYLES */
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:4px;background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.2);margin-top:6px;}
.sync-dot{width:4px;height:4px;border-radius:50%;background:#2ecc71;animation:pulse 2s infinite;}
.user-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);}
.user-avatar{width:27px;height:27px;border-radius:50%;object-fit:cover;border:1px solid var(--border-a);background:var(--bg3);}
.user-name{font-size:11px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logout-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;font-family:'DM Mono',monospace;padding:2px 5px;}
.login-screen{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;z-index:500;}
.login-screen.visible{display:flex;}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px 44px;text-align:center;max-width:340px;width:90%;position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--amber));}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.06em;margin-bottom:5px;}
.login-logo span{color:var(--accent);}
.google-btn{display:flex;align-items:center;justify-content:center;gap:11px;background:#fff;color:#333;border:none;border-radius:10px;padding:13px 22px;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.google-icon{width:18px;height:18px;}
.loading-screen{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:500;}
.loading-screen.visible{display:flex;}
.spinner{width:32px;height:32px;border:2px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .mob-header{display:flex;}
  .main{margin-left:0;padding:60px 13px 80px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .dash-top{grid-template-columns:1fr;}
  .drawer{width:100vw;}
}
</style>
</head>
<body>

<div class="loading-screen visible" id="loading-screen">
  <div class="spinner"></div>
  <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text3)">cargando nube...</div>
</div>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">FLU<span>JO</span></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:24px;">Tus finanzas sincronizadas en la nube.</p>
    <button class="google-btn" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Entrar con Google
    </button>
  </div>
</div>

<header class="mob-header" id="mob-header" style="display:none;">
  <div class="mob-logo">FLU<span>JO</span></div>
  <button class="mob-menu-btn" onclick="toggleSidebar()">&#9776;</button>
</header>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app-shell" id="app-shell" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-word">FLU<span>JO</span></div>
      <div class="logo-sub">finanzas personales</div>
      <div class="sync-badge"><span class="sync-dot"></span>nube activa</div>
    </div>
    <div class="user-bar" id="user-bar">
      <img class="user-avatar" id="user-avatar" src="" alt=""/>
      <span class="user-name" id="user-name"></span>
      <button class="logout-btn" onclick="logoutUser()">salir</button>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="goPanel('dashboard',this)"><span class="nav-icon">&#9635;</span>Dashboard</div>
      <div class="nav-item" onclick="goPanel('fixed',this)"><span class="nav-icon">&#10792;</span>Costos fijos</div>
      <div class="nav-item" onclick="goPanel('variable',this)"><span class="nav-icon">&#9673;</span>Costos variables</div>
      <div class="nav-item" onclick="goPanel('register',this)"><span class="nav-icon">&#8853;</span>Registrar gasto</div>
      <div class="nav-item" onclick="goPanel('history',this)"><span class="nav-icon">&#9678;</span>Historial</div>
    </nav>
    <div class="sidebar-footer">
      <div class="month-badge" id="current-month-label"></div>
      <button class="close-month-btn" onclick="closeMonth()">Cerrar mes &rarr;</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title" id="page-title-txt">DASH<span>BOARD</span></div>
      <div class="salary-block">
        <span class="salary-label">Sueldo</span>
        <div class="salary-input-wrap">
          <span class="salary-prefix">$</span>
          <input class="salary-input" type="number" id="salary" placeholder="0" oninput="onSalaryChange()"/>
        </div>
      </div>
    </div>
    <div class="kpi-row" id="kpi-row"></div>

    <div class="panel active" id="panel-dashboard">
      <div id="wallet-section"></div>
      <div class="dash-top">
        <div class="dash-kpis-extra" id="dash-kpis-extra"></div>
        <div class="donut-wrap">
          <div class="donut-title">Distribucion</div>
          <div class="donut-svg-wrap">
            <svg viewBox="0 0 144 144" id="donut-svg"></svg>
            <div class="donut-center">
              <div class="donut-center-pct" id="donut-pct">--</div>
              <div class="donut-center-lbl" id="donut-lbl">uso</div>
            </div>
          </div>
          <div class="donut-legend" id="donut-legend"></div>
        </div>
      </div>
      <div id="dash-overview"></div>
    </div>

    <div class="panel" id="panel-fixed">
      <div id="fixed-list"></div>
      <div class="add-form">
        <input type="text" id="fixed-name" placeholder="Nombre"/>
        <input type="number" id="fixed-amount" placeholder="Monto $"/>
        <button class="add-btn" onclick="addFixed()">+ Agregar</button>
      </div>
    </div>

    <div class="panel" id="panel-variable">
      <div id="var-list"></div>
      <div class="add-form">
        <input type="text" id="var-name" placeholder="Nombre"/>
        <input type="number" id="var-budget" placeholder="Presupuesto $"/>
        <button class="add-btn" onclick="addVar()">+ Agregar</button>
      </div>
    </div>

    <div class="panel" id="panel-register">
      <div class="add-form">
        <select id="reg-cat"></select>
        <input type="number" id="reg-amount" placeholder="Monto $"/>
        <input type="text" id="reg-desc" placeholder="Nota"/>
        <button class="add-btn" onclick="addExpense()">Registrar</button>
      </div>
      <div id="register-list" class="reg-expense-list"></div>
    </div>

    <div class="panel" id="panel-history">
      <div id="history-list"></div>
    </div>
  </main>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="var-drawer">
  <div class="drawer-header">
    <button class="drawer-back" onclick="closeDrawer()">&#8592;</button>
    <div class="drawer-title" id="drawer-title">Categoria</div>
  </div>
  <div class="drawer-body">
    <div class="drawer-stats" id="drawer-stats"></div>
    <div class="drawer-expense-list" id="drawer-expense-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- CONEXIÓN SUPABASE ---
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// --- LOGICA DE ESTADO ---
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function defaultState(){
  return { salary:0, fixed:[], variable:[], expenses:[], history:[], savings:0, nextId:1,
    month:new Date().getMonth(), year:new Date().getFullYear() };
}

let S = defaultState();
let usdRate = 1400;

// --- CLOUD SYNC ---
async function saveToCloud(){
  try {
    const { data: { user } } = await sbClient.auth.getUser();
    if (!user) return;
    await sbClient.from('flujo_data').upsert({
      user_id: user.id,
      data: S,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  } catch (e) { console.warn("Error nube:", e); }
}

async function loadFromCloud(userId){
  try {
    const { data } = await sbClient.from('flujo_data').select('data').eq('user_id', userId).single();
    if (data && data.data) { S = data.data; render(); }
  } catch (e) { console.warn("Carga fallida:", e); }
}

function saveState(){
  localStorage.setItem('flujo_v3', JSON.stringify(S));
  saveToCloud();
}

// --- AUTH ACTIONS ---
async function loginGoogle(){
  await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
}

async function logoutUser(){
  await sbClient.auth.signOut();
  window.location.reload();
}

// --- APP LOGIC ---
function fmt(n){return '$'+Math.round(n).toLocaleString('es-AR');}
function iid(id){return parseInt(id);}
function getSpent(id){return S.expenses.filter(e=>iid(e.varId)===iid(id)).reduce((s,e)=>s+e.amount,0);}
function totalFixed(){return S.fixed.reduce((s,f)=>s+f.amount,0);}
function totalVarBudget(){return S.variable.reduce((s,v)=>s+v.budget+(v.bonus||0),0);}

function render(){
  document.getElementById('salary').value = S.salary;
  document.getElementById('current-month-label').textContent = MONTHS[S.month]+' '+S.year;
  renderKPIs(); renderDash(); renderFixed(); renderVar(); renderRegister(); renderHistory();
}

function renderKPIs(){
  const tf = totalFixed(), tv = totalVarBudget(), ts = S.expenses.reduce((s,e)=>s+e.amount,0);
  const free = S.salary - tf - tv;
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="kpi-label">Fijos</div><div class="kpi-val accent">${fmt(tf)}</div></div>
    <div class="kpi"><div class="kpi-label">Variables</div><div class="kpi-val">${fmt(ts)}</div></div>
    <div class="kpi"><div class="kpi-label">Libre</div><div class="kpi-val ok">${fmt(free)}</div></div>`;
}

function renderDash(){
  let html = '';
  S.variable.forEach(v=>{
    const spent = getSpent(v.id), total = v.budget+(v.bonus||0);
    const pct = total > 0 ? Math.min(100, (spent/total)*100) : 0;
    html += `<div class="cost-card"><div class="cost-top"><span>${v.name}</span><b>${fmt(total-spent)}</b></div>
             <div class="progress-wrap"><div class="progress-track"><div class="progress-bar" style="width:${pct}%; background:var(--accent)"></div></div></div></div>`;
  });
  document.getElementById('dash-overview').innerHTML = html;
  renderDonut();
}

function renderDonut(){
  const sal = S.salary || 1, tf = totalFixed(), tv = totalVarBudget();
  const pct = Math.round(((tf+tv)/sal)*100);
  document.getElementById('donut-pct').textContent = pct + '%';
  document.getElementById('donut-svg').innerHTML = `<circle cx="72" cy="72" r="55" fill="none" stroke="#222" stroke-width="18"/><circle cx="72" cy="72" r="55" fill="none" stroke="var(--accent)" stroke-width="18" stroke-dasharray="${(pct/100)*345} 345" transform="rotate(-90 72 72)"/>`;
}

// --- FORM ACTIONS ---
function onSalaryChange(){ S.salary = parseFloat(document.getElementById('salary').value)||0; saveState(); render(); }

function addFixed(){
  const n = document.getElementById('fixed-name').value, a = parseFloat(document.getElementById('fixed-amount').value);
  if(!n || !a) return; S.fixed.push({id:Date.now(), name:n, amount:a}); saveState(); render();
}

function addVar(){
  const n = document.getElementById('var-name').value, b = parseFloat(document.getElementById('var-budget').value);
  if(!n || !b) return; S.variable.push({id:Date.now(), name:n, budget:b, bonus:0}); saveState(); render();
}

function addExpense(){
  const cat = iid(document.getElementById('reg-cat').value), amt = parseFloat(document.getElementById('reg-amount').value);
  if(!cat || !amt) return; S.expenses.push({id:Date.now(), varId:cat, amount:amt, desc:document.getElementById('reg-desc').value, date:new Date()});
  saveState(); render();
}

function renderFixed(){ document.getElementById('fixed-list').innerHTML = S.fixed.map(f=>`<div class="cost-card"><span>${f.name}</span><b>${fmt(f.amount)}</b></div>`).join(''); }
function renderVar(){ document.getElementById('var-list').innerHTML = S.variable.map(v=>`<div class="cost-card" onclick="openDrawer(${v.id})"><span>${v.name}</span><b>${fmt(v.budget)}</b></div>`).join(''); }
function renderRegister(){ document.getElementById('reg-cat').innerHTML = S.variable.map(v=>`<option value="${v.id}">${v.name}</option>`).join(''); }
function renderHistory(){ document.getElementById('history-list').innerHTML = S.history.length ? 'Meses cerrados: ' + S.history.length : 'Sin historial'; }

function closeMonth(){
  S.history.push({date: new Date(), savings: S.salary - totalFixed() - S.expenses.reduce((s,e)=>s+e.amount,0)});
  S.expenses = []; S.month = (S.month + 1) % 12; saveState(); render(); toast("Mes cerrado y guardado");
}

function openDrawer(id){ document.getElementById('var-drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('var-drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }

function goPanel(id, el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active');
}

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }

function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

// --- INIT ---
async function init(){
  const { data: { session } } = await sbClient.auth.getSession();
  if(!session){
    document.getElementById('loading-screen').classList.remove('visible');
    document.getElementById('login-screen').classList.add('visible');
  } else {
    await loadFromCloud(session.user.id);
    document.getElementById('user-name').textContent = session.user.user_metadata.full_name || session.user.email;
    document.getElementById('user-avatar').src = session.user.user_metadata.avatar_url || '';
    document.getElementById('loading-screen').classList.remove('visible');
    document.getElementById('app-shell').style.display = 'flex';
    document.getElementById('mob-header').style.display = 'flex';
    render();
  }
}
init();
</script>
</body>
</html>
